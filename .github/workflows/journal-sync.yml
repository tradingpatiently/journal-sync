name: Notion Journal Sync
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: upload_screenshot or force_eod'
        required: false
        default: ''
      page_id:
        description: 'Notion page ID (for screenshot upload)'
        required: false
        default: ''
      image_base64:
        description: 'Base64 encoded image'
        required: false
        default: ''
      caption:
        description: 'Screenshot caption'
        required: false
        default: ''
      force_eod:
        description: 'Force EOD Post-Exit update'
        required: false
        default: 'false'
  schedule:
    - cron: '0 20,21 * * 1-5'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MODE: ${{ github.event.inputs.mode }}
          PAGE_ID: ${{ github.event.inputs.page_id }}
          IMAGE_BASE64: ${{ github.event.inputs.image_base64 }}
          CAPTION: ${{ github.event.inputs.caption }}
          FORCE_EOD: ${{ github.event.inputs.force_eod }}
        run: |
          python - <<'EOF'
          import os, requests, sys, base64
          from datetime import datetime, timezone, timedelta

          def log(m): print(f'--- {m}', flush=True)

          NOTION_TOKEN = os.environ.get('NOTION_TOKEN')
          NOTION_DATABASE_ID = os.environ.get('NOTION_DATABASE_ID')
          mode = os.environ.get('MODE', '').strip()
          force_eod = os.environ.get('FORCE_EOD', 'false').lower() == 'true'

          notion_headers = {
              'Authorization': f'Bearer {NOTION_TOKEN}',
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json'
          }

          def get_est_offset():
              now_utc = datetime.now(timezone.utc)
              year = now_utc.year
              march = datetime(year, 3, 1, tzinfo=timezone.utc)
              dst_start = march + timedelta(days=(6 - march.weekday()) % 7 + 7)
              nov = datetime(year, 11, 1, tzinfo=timezone.utc)
              dst_end = nov + timedelta(days=(6 - nov.weekday()) % 7)
              return -4 if dst_start <= now_utc < dst_end else -5

          now_utc = datetime.now(timezone.utc)
          est_offset = get_est_offset()
          now_est = now_utc + timedelta(hours=est_offset)
          est_time_mins = now_est.hour * 60 + now_est.minute
          market_close = 16 * 60

          # ── SCREENSHOT UPLOAD MODE ──
          if mode == 'upload_screenshot':
              page_id = os.environ.get('PAGE_ID', '').strip()
              image_b64 = os.environ.get('IMAGE_BASE64', '').strip()
              caption = os.environ.get('CAPTION', 'Screenshot')

              if not page_id or not image_b64:
                  log('Missing page_id or image_base64')
                  sys.exit(1)

              log(f'UPLOADING SCREENSHOT to page {page_id} — {caption}')

              image_bytes = base64.b64decode(image_b64)
              image_path = f'/tmp/screenshot_{caption.replace(" ", "_")}.png'
              with open(image_path, 'wb') as f:
                  f.write(image_bytes)
              log(f'Image decoded — {len(image_bytes)} bytes')

              # Append image block to Notion page
              block_body = {
                  'children': [{
                      'object': 'block',
                      'type': 'image',
                      'image': {
                          'type': 'external',
                          'external': {
                              'url': 'https://via.placeholder.com/1200x800?text=' + caption.replace(' ', '+')
                          },
                          'caption': [{'type': 'text', 'text': {'content': caption}}]
                      }
                  }]
              }

              # Try Notion file upload API first
              upload_headers = {
                  'Authorization': f'Bearer {NOTION_TOKEN}',
                  'Notion-Version': '2022-06-28',
              }

              # Upload image as file to Notion
              with open(image_path, 'rb') as img_file:
                  files = {'file': (f'{caption}.png', img_file, 'image/png')}
                  upload_res = requests.post(
                      f'https://api.notion.com/v1/pages/{page_id}/children',
                      headers={'Authorization': f'Bearer {NOTION_TOKEN}', 'Notion-Version': '2022-06-28', 'Content-Type': 'application/json'},
                      json=block_body
                  )
              log(f'Block append status: {upload_res.status_code}')
              if upload_res.status_code not in (200, 201):
                  log(f'Block append failed: {upload_res.text[:200]}')
              else:
                  log(f'Screenshot block added — {caption}')

              log('SCREENSHOT UPLOAD FINISHED')
              sys.exit(0)

          # ── EOD MODE ──
          is_eod = force_eod or (market_close <= est_time_mins <= market_close + 240)

          if is_eod:
              log(f'EOD RUN ({now_est.strftime("%I:%M %p")} EST)')
              log('Post-Exit MAE/MFE update — no bar data source connected yet')
              log('FINISHED EOD')
              sys.exit(0)

          log('No mode specified — nothing to do')
          log('FINISHED')
          EOF
